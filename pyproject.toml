# SPDX-License-Identifier: MulanPSL-2.0
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova5-support"
version = "0.1.0"
description = "RGB hand-eye calibration and bounded PGI protocol helpers for Nova5"
readme = "README.md"
requires-python = ">=3.11"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
maintainers = [{name = "Rui Ye", email = "yerui@mails.neu.edu.cn"}]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "opencv-python>=4.8,<5",
  "reportlab>=4,<5",
  "pyserial==3.5",
]

[project.optional-dependencies]
robot = ["dobot_sdk @ git+https://github.com/Dobot-Arm/TCP-IP-Python-V4.git@55ec1ec82201aaf2e6d54aa47b6272bbaa14c815"]
camera = ["pyorbbecsdk2==2.1.3"]
test = ["pytest>=7,<10"]

[project.scripts]
nova5-calibrate = "handeye.cli:main"
nova5-checkerboard = "handeye.board:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
